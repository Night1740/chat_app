<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #chatApp {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }

    .chat-container {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #16213e;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      border-bottom: 1px solid #333;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .chat-header .info {
      font-size: 12px;
      opacity: 0.7;
    }

    .chat-area {
      flex: 1;
      background: #1a1a2e;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }

    .message {
      margin-bottom: 15px;
      max-width: 80%;
    }

    .message.my {
      margin-left: auto;
      max-width: 80%;
      text-align: right;
    }

    .message .name {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      display: block;
    }

    .message .text {
      background: #4a90e2;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
    }

    .message.other .text {
      background: #3b3b4f;
      color: #fff;
    }

    .input-area {
      padding: 20px;
      background: #16213e;
      display: flex;
      gap: 12px;
      border-top: 1px solid #333;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 20px;
      background: #2d3748;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .input-area button {
      padding: 0 24px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .status-bar {
      background: #0d1117;
      padding: 8px 20px;
      color: #888;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-bar .users {
      font-weight: 500;
    }

    /* Hide code display */
    .code-display { display: none; }
  </style>
</head>
<body>
  <div id="chatApp">
    <div class="chat-header">
      <h1>Simple Chat</h1>
      <div class="info" id="roomInfo">Join a channel to chat</div>
    </div>

    <div class="chat-area" id="messagesArea">
      <!-- Messages loaded via socket.io -->
    </div>

    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>

    <div class="status-bar">
      <span class="users" id="userCount">0</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesArea = document.getElementById('messagesArea');
    const roomInfo = document.getElementById('roomInfo');
    const userCount = document.getElementById('userCount');

    let currentCode = '';
    let currentName = '';

    // Send message
    sendBtn.addEventListener('click', () => {
      sendMessage();
    });

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit('chat message', { code: currentCode, name: currentName, text });
      addMessageToDOM(currentName, text, true);
      msgInput.value = '';
    }

    // Listen for messages
    socket.on('load messages', (msgs) => {
      messagesArea.innerHTML = '';
      msgs.forEach(msg => addMessageToDOM(msg.name, msg.text, false));
    });

    socket.on('chat message', (data) => {
      addMessageToDOM(data.name, data.text, false);
    });

    socket.on('user joined', (data) => {
      updateUserCount();
      addSystemMessage(`${data.name} joined`);
    });

    socket.on('user left', (data) => {
      updateUserCount();
      addSystemMessage(`${data.name} left`);
    });

    function addMessageToDOM(name, text, isMyMessage) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMyMessage ? 'my' : 'other'}`;
      
      msgDiv.innerHTML = `
        <div class="name">${isMyMessage ? 'You' : name}</div>
        <div class="text">${escapeHtml(text)}</div>
      `;
      
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.style.cssText = 'background: #2d374f; padding: 10px; margin: 10px 0; border-radius: 8px;';
      msgDiv.innerHTML = `<div style="color: #888;">${text}</div>`;
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function updateUserCount() {
      // Count users in rooms - simple approach
      socket.emit('join room', { code: currentCode, name: currentName });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
