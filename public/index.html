<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat - Admin Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: #4a5568;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.8;
    }

    .main {
      padding: 24px;
    }

    .code-entry {
      margin-bottom: 20px;
    }

    .code-entry label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .code-entry input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .code-entry input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #5a67d8;
    }

    .btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #38bdf8;
    }

    .btn-primary:hover {
      background: #06d6a0;
    }

    .chat-area {
      display: none;
      flex-direction: column;
      height: 500px;
      background: #f8f9fa;
    }

    .chat-area.active {
      display: flex;
    }

    .sidebar {
      width: 60px;
      background: #2d3748;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar .code {
      background: #4a5568;
      color: white;
      padding: 8px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .sidebar .user {
      color: #cbd5e0;
      font-size: 11px;
      margin-bottom: 12px;
      text-align: center;
    }

    .sidebar .admin-status {
      background: #e53e3e;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      max-width: 85%;
    }

    .message.my {
      margin-left: auto;
      max-width: 85%;
    }

    .message .name {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
      display: block;
    }

    .message .text {
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.my .text {
      background: #667eea;
      color: white;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      padding: 0 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .input-area button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .file-upload {
      margin-top: 12px;
      padding: 8px;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      text-align: center;
      color: #718096;
    }

    .file-upload input {
      display: none;
    }

    .file-list {
      margin-top: 8px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 12px;
    }

    .file-item {
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    /* Phase 1: Login Screen */
    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .login-screen h2 {
      margin-bottom: 20px;
      color: #4a5568;
    }

    .login-screen p {
      margin-bottom: 20px;
      color: #718096;
      font-size: 14px;
    }

    .login-form {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-form input {
      padding: 12px 16px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
    }

    .login-form input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-form .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #718096;
    }

    .login-form .remember input {
      width: 16px;
      height: 16px;
    }

    /* Phase 2: Admin Dashboard (after login) */
    .admin-dashboard {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .admin-dashboard.active {
      display: flex;
    }

    .admin-panel {
      background: #4a5568;
      color: white;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 20px;
      text-align: center;
    }

    .admin-panel h3 {
      margin-bottom: 15px;
    }

    .channel-list {
      background: #fafafa;
      padding: 15px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      max-height: 200px;
      overflow-y: auto;
    }

    .channel-list p {
      color: #718096;
      font-size: 12px;
      margin-bottom: 10px;
      text-align: center;
    }

    .channel-code {
      background: #667eea;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 18px;
      margin: 10px 0;
      word-break: break-all;
    }

    .share-link {
      background: #e2e8f0;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      margin: 8px 0;
      word-break: break-all;
    }

    /* Phase 3: Chat Interface */
    .chat-controls {
      background: #4a5568;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .chat-controls span {
      margin-right: 20px;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatApp">
    <!-- Phase 1: Admin Login Screen -->
    <div class="login-screen" id="loginScreen">
      <h2>Simple Chat</h2>
      <p>Admin Authentication Required</p>
      
      <form class="login-form" id="loginForm">
        <input type="text" id="adminUsername" placeholder="Username" required>
        <input type="password" id="adminPassword" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Login as Admin</button>
      </form>
      
      <p>Or enter as a guest:</p>
      <button class="btn" id="guestBtn">Join as Guest</button>
    </div>

    <!-- Phase 2: Admin Dashboard (after login) -->
    <div class="admin-dashboard" id="adminDashboard">
      <div class="admin-panel">
        <h3>Admin Panel</h3>
        <div class="channel-list">
          <p>No channels created yet</p>
          <div id="channelList">Create a channel to get started</div>
        </div>
        
        <div>
          <label>Create New Channel Code</label>
          <input type="text" id="newCodeInput" placeholder="e.g., general" autocomplete="off">
          <button class="btn btn-primary" id="createBtn">Create Channel</button>
        </div>
      </div>
    </div>

    <!-- Phase 3: Chat Interface (for both admin and regular users) -->
    <div class="chat-area" id="chatArea">
      <div class="sidebar">
        <div class="code" id="roomCode"></div>
        <div class="user" id="userName"></div>
        <div class="admin-status" id="adminStatus"></div>
      </div>
      
      <div class="messages" id="messages"></div>
      
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" />
        <button class="btn" id="sendBtn">Send</button>
      </div>
      
      <div class="channel-info" id="channelInfo">
        <strong>Channel:</strong> <code id="displayCode"></code>
      </div>
      
      <div class="file-upload" id="fileUpload">
        <p>Upload File</p>
        <input type="file" id="fileInput" accept="image/*">
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // DOM Elements - Phase 1 (Login)
    const loginScreen = document.getElementById('loginScreen');
    const adminDashboard = document.getElementById('adminDashboard');
    const chatArea = document.getElementById('chatArea');
    const loginForm = document.getElementById('loginForm');
    const adminUsername = document.getElementById('adminUsername');
    const adminPassword = document.getElementById('adminPassword');
    const guestBtn = document.getElementById('guestBtn');
    const createBtn = document.getElementById('createBtn');
    const newCodeInput = document.getElementById('newCodeInput');
    const channelList = document.getElementById('channelList');

    // DOM Elements - Phase 3 (Chat)
    const roomCode = document.getElementById('roomCode');
    const userName = document.getElementById('userName');
    const messages = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const channelInfo = document.getElementById('channelInfo');
    const displayCode = document.getElementById('displayCode');
    const adminStatus = document.getElementById('adminStatus');

    // State variables
    let currentCode = '';
    let currentName = '';
    let isAdmin = false;
    let adminName = '';

    // ADMIN CREDENTIALS (match server.js)
    const ADMIN_USERNAME = 'DarkTiger';
    const ADMIN_PASSWORD = 'night_1117';

    // ===== PHASE 1: Admin Login =====

    // Handle login form submission
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = adminUsername.value.trim();
      const password = adminPassword.value.trim();

      if (!username || !password) {
        alert('Please enter both username and password');
        return;
      }

      // Send credentials to server
      socket.emit('admin login', { username, password });
    });

    // Handle login success/failure from server
    socket.on('admin login success', (result) => {
      if (result.success) {
        isAdmin = true;
        adminName = result.username || 'DarkTiger';
        
        // Show admin dashboard, hide login
        loginScreen.classList.add('hidden');
        adminDashboard.classList.add('active');
        
        // Update UI
        userName.textContent = adminName;
        adminStatus.innerHTML = '<span style="background: #e53e3e;"></span> Admin';
        
        // Show channel creation UI
        createBtn.disabled = false;
        
        // Notify server this admin is connected
        socket.emit('identify admin', { name: adminName });
      } else {
        alert('Login failed: ' + (result.error || 'Invalid credentials'));
      }
    });

    // Guest join option
    guestBtn.addEventListener('click', () => {
      // Hide login, show chat as guest (non-admin)
      loginScreen.classList.add('hidden');
      adminDashboard.classList.add('hidden');
      chatArea.classList.add('active');
      
      // Prompt for name and code
      const guestName = prompt('Enter your name:');
      if (!guestName) return;
      
      const guestCode = prompt('Enter channel code:');
      if (!guestCode) return;
      
      joinAsGuest(guestName, guestCode);
    });

    function joinAsGuest(name, code) {
      currentCode = code;
      currentName = name;
      isAdmin = false;

      socket.emit('join room', { code, name });

      // Show chat area, hide others
      loginScreen.classList.add('hidden');
      adminDashboard.classList.add('hidden');
      chatArea.classList.add('active');

      // Update UI
      userName.textContent = name;
      adminStatus.innerHTML = '<span style="background: #38bdf8;"></span> Guest';
      roomCode.textContent = code;
      displayCode.textContent = code;
    }

    // ===== PHASE 2: Admin Channel Creation =====

    // Create channel button
    createBtn.addEventListener('click', () => {
      if (!isAdmin) return;
      const newCode = newCodeInput.value.trim();
      if (!newCode) {
        alert('Please enter a channel code name');
        return;
      }
      
      socket.emit('create channel', { code: newCode });
      newCodeInput.value = '';
    });

    // Handle channel created event from server
    socket.on('channel created', (data) {
      addSystemMessage(`New channel created: ${data.code}`);
      // Add to channel list
      const codeDiv = document.createElement('div');
      codeDiv.className = 'channel-code';
      codeDiv.textContent = data.code;
      channelList.appendChild(codeDiv);
    });

    // ===== PHASE 3: Chat Interface =====

    // Send message
    sendBtn.addEventListener('click', () => {
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit('chat message', { code: currentCode, name: currentName, text });
      addMessageToDOM(currentName, text, true);
      msgInput.value = '';
    });

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    // Listen for join confirmation and messages
    socket.on('load messages', (msgs) => {
      messages.innerHTML = '';
      msgs.forEach(msg => addMessageToDOM(msg.name, msg.text, false));
    });

    socket.on('chat message', (data) => {
      addMessageToDOM(data.name, data.text, false);
    });

    socket.on('user joined', (data) => {
      addSystemMessage(`${data.name} joined the room`);
      if (data.isAdmin) {
        channelInfo.classList.add('admin-show');
        displayCode.textContent = data.code;
        adminStatus.innerHTML = '<span style="background: #e53e3e;"></span> Admin';
      }
    });

    socket.on('user left', (data) => {
      addSystemMessage(`${data.name} left the room`);
    });

    // Handle join denied (non-admin trying to join non-existent room)
    socket.on('join denied', (data) => {
      alert(data.error || 'Could not join channel');
    });

    function addMessageToDOM(name, text, isMyMessage) {
      const div = document.createElement('div');
      div.className = `message ${isMyMessage ? 'my' : ''}`;
      
      div.innerHTML = `
        <span class="name">${name}</span>
        <div class="text">${escapeHtml(text)}</div>
      `;
      
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<div class="text" style="background: #e2e8f0; color: #718096; padding: 12px 16px; border-radius: 12px; font-size: 12px;">${escapeHtml(text)}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
