<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat - Enter Channel Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .header {
      background: #4a5568;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.8;
    }

    .main {
      padding: 24px;
    }

    .code-entry {
      margin-bottom: 20px;
    }

    .code-entry label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .code-entry input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .code-entry input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #5a67d8;
    }

    .btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .chat-area {
      display: none;
      flex-direction: column;
      height: 500px;
    }

    .chat-area.active {
      display: flex;
    }

    .sidebar {
      width: 60px;
      background: #2d3748;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar .code {
      background: #4a5568;
      color: white;
      padding: 8px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      overflow-wrap: break-word;
    }

    .sidebar .user {
      color: #cbd5e0;
      font-size: 11px;
      margin-bottom: 12px;
      text-align: center;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      max-width: 80%;
    }

    .message.my {
      margin-left: auto;
      max-width: 85%;
    }

    .message .name {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
      display: block;
    }

    .message .text {
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.my .text {
      background: #667eea;
      color: white;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      padding: 0 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .input-area button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .file-upload {
      margin-top: 12px;
      padding: 8px;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      text-align: center;
      color: #718096;
    }

    .file-upload input {
      display: none;
    }

    .file-list {
      margin-top: 8px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 12px;
    }

    .file-item {
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatApp">
    <!-- Phase 1: Channel Entry -->
    <div class="header">
      <h1>Simple Chat</h1>
      <p>Enter a channel code to join</p>
    </div>
    
    <div class="main">
      <div class="code-entry">
        <label>Channel Code</label>
        <input type="text" id="codeInput" placeholder="e.g., room1" autocomplete="off">
      </div>
      <div class="code-entry">
        <label>Your Name</label>
        <input type="text" id="nameInput" placeholder="e.g., Alice" autocomplete="off">
      </div>
      <button class="btn" id="joinBtn">Join Channel</button>
    </div>

    <!-- Phase 2: Chat Interface -->
    <div class="chat-area" id="chatArea">
      <div class="sidebar">
        <div class="code" id="roomCode"></div>
        <div class="user" id="userName"></div>
      </div>
      
      <div class="messages" id="messages"></div>
      
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" />
        <button class="btn" id="sendBtn">Send</button>
      </div>
      
      <div class="file-upload" id="fileUpload">
        <p>Upload File</p>
        <input type="file" id="fileInput" accept="image/*">
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const chatApp = document.getElementById('chatApp');
    const codeInput = document.getElementById('codeInput');
    const nameInput = document.getElementById('nameInput');
    const joinBtn = document.getElementById('joinBtn');
    const chatArea = document.getElementById('chatArea');
    const roomCode = document.getElementById('roomCode');
    const userName = document.getElementById('userName');
    const messages = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    let currentCode = '';
    let currentName = '';

    // Phase 1: Join channel
    joinBtn.addEventListener('click', () => {
      const code = codeInput.value.trim();
      const name = nameInput.value.trim();

      if (!code || !name) {
        alert('Please enter both channel code and your name');
        return;
      }

      currentCode = code;
      currentName = name;

      socket.emit('join room', { code, name });

      // Show chat area, hide entry
      chatApp.classList.add('phase-completed');
    });

    // Listen for join confirmation and messages
    socket.on('load messages', (msgs) => {
      messages.innerHTML = '';
      msgs.forEach(msg => addMessageToDOM(msg.name, msg.text, false));
    });

    socket.on('chat message', (data) => {
      addMessageToDOM(data.name, data.text, false);
    });

    socket.on('user joined', (data) => {
      addSystemMessage(`${data.name} joined the room`);
    });

    socket.on('user left', (data) => {
      addSystemMessage(`${data.name} left the room`);
    });

    // Phase 2: Send message
    sendBtn.addEventListener('click', () => {
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit('chat message', { code: currentCode, name: currentName, text });
      addMessageToDOM(currentName, text, true);
      msgInput.value = '';
    });

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    // File upload
    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (files.length === 0) return;

      const formData = new FormData();
      Array.from(files).forEach(file => formData.append('files', file));

      socket.emit('upload file', { code: currentCode, formData });
      msgInput.value = '';
    });

    function addMessageToDOM(name, text, isMyMessage) {
      const div = document.createElement('div');
      div.className = `message ${isMyMessage ? 'my' : ''}`;
      
      div.innerHTML = `
        <span class="name">${name}</span>
        <div class="text">${escapeHtml(text)}</div>
      `;
      
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message';
      div.style.maxWidth: '100%';
      div.innerHTML = `<div class="text" style="background: #e2e8f0; color: #718096; padding: 12px 16px; border-radius: 12px; font-size: 12px;">${escapeHtml(text)}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
